name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/discord-notifications:scan
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/discord-notifications:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/osthelia/discord-notifications:${{ github.sha }}

  # Inline steps instead of the reusable workflow: this repository is public and cannot call a workflow
  # from the private Osthelia/GitOps repository.
  gitops:
    name: Bump discord-notifications
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: gitops-bump
      cancel-in-progress: false
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Osthelia/GitOps
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Set tag
        env:
          IMAGE: discord-notifications
          TAG: ${{ github.sha }}
          FILE: apps/staging/kustomization.yaml
        run: |
          set -euo pipefail
          grep -qE "name: ghcr\.io/osthelia/${IMAGE}," "$FILE" \
            || { echo "::error::${IMAGE} not found in ${FILE}"; exit 1; }
          sed -i -E "s#(name: ghcr\.io/osthelia/${IMAGE},[[:space:]]*newTag:)[^}]*#\1 \"${TAG}\" #" "$FILE"
          grep -E "name: ghcr\.io/osthelia/${IMAGE}," "$FILE"

      - name: Commit and push
        env:
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(staging): discord-notifications -> ${TAG:0:7}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::push failed after 3 attempts"
          exit 1
